{% set name = "google-cloud-core" %}
{% set version = "2.8.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # PyPI sdist from googleapis/google-cloud-python monorepo (packages/google-cloud-core)
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: 365f8e4518ae81c8101b8dea5fc1c32a960badedb8b511f19db2843cbbd285d2

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - google-api-core >=2.28.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
  run_constrained:
    # optional [grpc] extra — setup.py
    - grpcio >=1.59.0,<2.0.0  # [py<314]
    - grpcio >=1.75.1,<2.0.0  # [py>=314]
    - grpcio-status >=1.59.0,<2.0.0  # [py<314]
    - grpcio-status >=1.75.1,<2.0.0  # [py>=314]

test:
  source_files: tests
  imports:
    - google.api_core.client_info
    - google.cloud.client
    - google.cloud.environment_vars
    - google.cloud.exceptions
    - google.cloud.operation
    - google.auth
    - google.cloud
    - google.longrunning
    - google.oauth2
    - google.protobuf
    - google.rpc
    - google.type
  requires:
    - pip
    - pytest
    - grpcio >=1.59.0,<2.0.0  # [py<314]
    - grpcio >=1.75.1,<2.0.0  # [py>=314]
    - grpcio-status >=1.59.0,<2.0.0  # [py<314]
    - grpcio-status >=1.75.1,<2.0.0  # [py>=314]
  commands:
    - python -m pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -ra -vv tests

about:
  home: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-core
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: API Client library for Google Cloud Core Helpers
  description: |
    This library is not meant to stand-alone. Instead it defines common helpers
    (e.g. base Client and Connection classes) used by all of the  google-cloud-*.
  doc_url: https://docs.cloud.google.com/python/docs/reference/google-cloud-core/latest
  dev_url: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-core

extra:
  recipe-maintainers:
    - leahecole
    - parthea
    - tswast
